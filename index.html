
<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Way | Volunteering Organization</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #252039;
      background: #f7f4ff;
      line-height: 1.6;
    }

    header {
      padding: 22px 18px;
      background: #fff;
      text-align: center;
      border-bottom: 1px solid #e8e0f7;
    }

    header h1 {
      margin: 0;
      color: #7351a6;
      font-size: 29px;
      letter-spacing: 2px;
    }

    header p {
      margin: 4px 0 0;
      color: #716981;
      font-size: 13px;
    }

    .hero {
      padding: 55px 20px 35px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      line-height: 1.3;
      margin: 0 auto 15px;
      max-width: 600px;
    }

    .hero p {
      max-width: 520px;
      margin: 0 auto;
      color: #6e687c;
    }

    .form-card {
      width: calc(100% - 32px);
      max-width: 520px;
      margin: 10px auto 55px;
      padding: 25px;
      background: #fff;
      border: 1px solid #e9e1f5;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(67, 44, 105, 0.07);
    }

    .form-card h2 {
      margin-top: 0;
      font-size: 23px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 17px;
      border: 1px solid #d9d0e8;
      border-radius: 9px;
      background: #fff;
      color: #252039;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: 2px solid #b9a1e5;
      border-color: #8060b2;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #7351a6;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #form-message {
      margin: 15px 0 0;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    footer {
      padding: 22px;
      text-align: center;
      background: #292334;
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>GOOD WAY</h1>
    <p>VOLUNTEERING ORGANIZATION</p>
  </header>

  <section class="hero">
    <h2>Միացի՛ր Good Way-ին</h2>
    <p>
      Քո ժամանակը, գաղափարներն ու էներգիան կարող են
      դրական փոփոխություն ստեղծել։ Դարձի՛ր մեր թիմի մի մասը։
    </p>
  </section>

  <main class="form-card">
    <h2>Կամավորական հայտ</h2>
    <p>Լրացրո՛ւ տվյալներդ՝ մեր թիմին միանալու համար։</p>

    <form id="volunteer-form">
      <label for="full_name">Անուն, ազգանուն</label>
      <input id="full_name" name="full_name"
        type="text" autocomplete="name" required>

      <label for="email">Էլեկտրոնային հասցե</label>
      <input id="email" name="email"
        type="email" autocomplete="email" required>

      <label for="phone">Հեռախոսահամար</label>
      <input id="phone" name="phone"
        type="tel" autocomplete="tel" required>

      <label for="age">Տարիք</label>
      <input id="age" name="age"
        type="number" min="14" max="100" required>

      <label for="program">Ո՞ր ուղղությամբ ես ցանկանում միանալ</label>
      <select id="program" name="program" required>
        <option value="">Ընտրիր ուղղությունը</option>
        <option value="Կամավորական ծրագրեր">Կամավորական ծրագրեր</option>
        <option value="Սեմինարներ և դասընթացներ">Սեմինարներ և դասընթացներ</option>
        <option value="Թիմային աշխատանք">Թիմային աշխատանք</option>
      </select>

      <button id="submit-button" type="submit">
        Ուղարկել հայտը
      </button>

      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    Good Way Volunteering Organization © 2026
  </footer>

  <script>
    // Փոխարինիր այս երկու արժեքները քո տվյալներով։
    // Եթե API URL-ը վերջանում է /rest/v1-ով,
    // կոդն ինքնուրույն կհեռացնի այդ հատվածը։

    const SUPABASE_URL = "https://hcggnmvnqefhfrasyfdd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wyCGqA1H18QvyLOk6vXCcQ_UyR3i0_Z";

    const baseUrl = SUPABASE_URL
      .trim()
      .replace(/\/+$/, "")
      .replace(/\/rest\/v1$/, "");

    const form = document.getElementById("volunteer-form");
    const message = document.getElementById("form-message");
    const button = document.getElementById("submit-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      sb_publishable_wyCGqA1H18QvyLOk6vXCcQ_UyR3i0_Z

      const application = {
        full_name: form.elements["full_name"].value.trim(),
        email: form.elements["email"].value.trim(),
        phone: form.elements["phone"].value.trim(),
        age: Number(form.elements["age"].value),
        program: form.elements["program"].value
      };

      button.disabled = true;
      button.textContent = "Ուղարկվում է...";
      message.textContent = "Խնդրում ենք սպասել...";

      try {
        const response = await fetch(
          `${baseUrl}/rest/v1/volunteer_applications`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(application)
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          console.error("Supabase error:", response.status, errorText);
          message.textContent =
            "Չհաջողվեց ուղարկել հայտը (" +
            response.status + "): " + errorText;
          return;
        }

        form.reset();
        message.textContent =
          "Շնորհակալություն։ Հայտդ հաջողությամբ ուղարկվեց։";

      } catch (error) {
        console.error("Request error:", error);
        message.textContent =
          "Կապի սխալ է առաջացել։ Ստուգիր ինտերնետային կապը։";
      } finally {
        button.disabled = false;
        button.textContent = "Ուղարկել հայտը";
      }
    });
  </script>
</body>
</html>
